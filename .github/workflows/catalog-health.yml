name: Runtime catalog health

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe published catalog
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base:
          - https://github.com/Diaojiangjun/media/releases/download/module
          - https://ghfast.top/https://github.com/Diaojiangjun/media/releases/download/module
          - https://gh-proxy.com/https://github.com/Diaojiangjun/media/releases/download/module
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify catalog and every artifact URL
        run: python3 scripts/runtime_catalog.py --verify-url "${{ matrix.base }}/catalog.json" --check-downloads
